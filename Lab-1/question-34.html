<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analog Clock</title>
    <style>
      /* General Styles */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
      }

      .clock {
        width: 300px;
        height: 300px;
        border: 20px solid black;
        border-radius: 50%;
        position: relative;
        padding: 20px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        background: white;
      }

      .clock-face {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Clock Hands */
      .hand {
        width: 50%;
        background: black;
        position: absolute;
        top: 50%;

        transform-origin: 100%;
        transform: rotate(90deg);
        transition: transform 0.05s cubic-bezier(0.1, 2.7, 0.58, 1);
      }

      .hour-hand {
        height: 6px;
        background: #333;
      }

      .minute-hand {
        height: 4px;
        background: #666;
      }

      .second-hand {
        height: 2px;
        background: red;
      }

      /* Clock Numbers */
      .number {
        position: absolute;
        font-size: 24px;
        font-weight: bold;
        transform: translate(-50%, -50%);
      }

      .number1 {
        top: 10%;
        left: 85%;
      }
      .number2 {
        top: 25%;
        left: 92%;
      }
      .number3 {
        top: 45%;
        left: 97%;
      }
      .number4 {
        top: 65%;
        left: 92%;
      }
      .number5 {
        top: 80%;
        left: 85%;
      }
      .number6 {
        top: 85%;
        left: 50%;
      }
      .number7 {
        top: 80%;
        left: 15%;
      }
      .number8 {
        top: 65%;
        left: 8%;
      }
      .number9 {
        top: 45%;
        left: 3%;
      }
      .number10 {
        top: 25%;
        left: 8%;
      }
      .number11 {
        top: 10%;
        left: 15%;
      }
      .number12 {
        top: 5%;
        left: 50%;
      }
    </style>
  </head>

  <body>
    <div class="clock">
      <div class="clock-face">
        <!-- Numbers around the clock -->
        <div class="number number1">1</div>
        <div class="number number2">2</div>
        <div class="number number3">3</div>
        <div class="number number4">4</div>
        <div class="number number5">5</div>
        <div class="number number6">6</div>
        <div class="number number7">7</div>
        <div class="number number8">8</div>
        <div class="number number9">9</div>
        <div class="number number10">10</div>
        <div class="number number11">11</div>
        <div class="number number12">12</div>

        <!-- Hands of the clock -->
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
      </div>
    </div>

    <script>
      // JavaScript for updating the clock hands
      const hourHand = document.querySelector(".hour-hand");
      const minuteHand = document.querySelector(".minute-hand");
      const secondHand = document.querySelector(".second-hand");

      function setDate() {
        const now = new Date();

        // Get current seconds, minutes, and hours
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();

        // Calculate the rotation for each hand
        const secondsDegrees = (seconds / 60) * 360 + 90; // Adjusted for proper position
        secondHand.style.transform = `rotate(${secondsDegrees}deg)`;

        const minutesDegrees = (minutes / 60) * 360 + (seconds / 60) * 6 + 90;
        minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;

        const hoursDegrees = (hours % 12) * 30 + (minutes / 60) * 30 + 90;
        hourHand.style.transform = `rotate(${hoursDegrees}deg)`;
      }

      // Update the clock every second
      setInterval(setDate, 1000);

      // Set the initial time
      setDate();
    </script>
  </body>
</html>
